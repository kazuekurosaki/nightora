<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Nightora - Modern Streaming Platform</title>
    <meta name="description" content="Streaming video kualitas HD dengan koleksi terlengkap, fitur A-Z list, dan update harian di Nightora.">
    <meta name="keywords" content="Nightora, streaming, nonton video, artist list, genre video">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <!-- Mobile Sidebar -->
    <div id="sidebarOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/60 z-[60] hidden"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white dark:bg-slate-900 z-[70] -translate-x-full transition-transform duration-300 border-r dark:border-slate-800 p-6">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black text-blue-500 italic">NIGHTORA</h2>
            <button onclick="toggleMenu()"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <nav class="space-y-2 font-bold text-sm">
            <button onclick="goHome(); toggleMenu()" class="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-xl transition"><i class="fa-solid fa-house mr-3"></i> BERANDA</button>
            <button onclick="renderAZ(); toggleMenu()" class="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-xl transition"><i class="fa-solid fa-sort-alpha-down mr-3"></i> A-Z LIST</button>
            <button onclick="renderFilterPage('artists'); toggleMenu()" class="w-full text-left p-3 hover:bg-pink-600 hover:text-white rounded-xl transition text-pink-500"><i class="fa-solid fa-star mr-3"></i> ARTIST LIST</button>
            <button onclick="renderFilterPage('genres'); toggleMenu()" class="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-xl transition"><i class="fa-solid fa-tags mr-3"></i> GENRE</button>
            <button onclick="renderFilterPage('studio'); toggleMenu()" class="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-xl transition"><i class="fa-solid fa-building mr-3"></i> STUDIO</button>
        </nav>
    </aside>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-nav px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 bg-slate-800/50 rounded-lg lg:hidden"><i class="fa-solid fa-bars-staggered"></i></button>
                <h1 onclick="goHome()" class="text-xl md:text-2xl font-black cursor-pointer text-blue-500 italic tracking-tighter">NIGHTORA</h1>
            </div>

            <!-- Search Desktop -->
            <div class="hidden lg:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Cari kode atau judul..." class="w-full bg-slate-800/50 border dark:border-slate-700 rounded-full py-2 px-10 outline-none focus:ring-2 ring-blue-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-slate-500"></i>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleNSFW()" id="nsfwBtn" class="px-3 py-1 rounded-full text-[10px] font-black border-2 border-red-600 text-red-600 transition">SFW</button>
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        
        <!-- Home View -->
        <div id="homeView">
            <div id="featuredHero" class="mb-10"></div>
            
            <h2 class="text-lg font-black mb-4 flex items-center gap-2 italic uppercase"><i class="fa-solid fa-fire text-orange-500"></i> Populer</h2>
            <div id="popularGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-6"></div>

            <h2 class="text-lg font-black mb-4 flex items-center gap-2 italic uppercase"><i class="fa-solid fa-clock text-blue-500"></i> Update Terbaru</h2>
            <div id="latestGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6"></div>
            
            <div class="flex justify-center mt-10">
                <button id="loadMoreBtn" onclick="loadMore()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition transform hover:scale-105 shadow-xl">MUAT LEBIH BANYAK</button>
            </div>
        </div>

        <!-- List View -->
        <div id="listView" class="hidden">
            <h2 id="listTitle" class="text-2xl font-black mb-8 text-blue-500 uppercase italic"></h2>
            <div id="listGrid" class="grid grid-cols-2 md:grid-cols-6 gap-4"></div>
        </div>

        <!-- Detail View -->
        <div id="detailView" class="hidden">
            <button onclick="goHome()" class="mb-6 flex items-center gap-2 text-blue-500 font-bold"><i class="fa-solid fa-arrow-left"></i> KEMBALI</button>
            <div id="postArea"></div>
        </div>
    </main>

    <script src="posts.js"></script>
    <script>
        let isNSFW = false;
        let limit = 10;

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        function toggleNSFW() {
            isNSFW = !isNSFW;
            const btn = document.getElementById('nsfwBtn');
            btn.innerText = isNSFW ? 'NSFW' : 'SFW';
            btn.classList.toggle('bg-red-600', isNSFW);
            btn.classList.toggle('text-white', isNSFW);
            renderHome();
        }

        function renderHome() {
            const data = videoData.filter(v => isNSFW ? true : !v.nsfw);
            
            // Hero
            const feat = data.find(v => v.isFeatured) || data[0];
            document.getElementById('featuredHero').innerHTML = `
                <div onclick="loadPost('${feat.id}')" class="relative h-64 md:h-[400px] rounded-3xl overflow-hidden cursor-pointer group">
                    <img src="${feat.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 p-6 flex flex-col justify-end">
                        <h2 class="text-2xl md:text-4xl font-black text-white italic tracking-tighter">${feat.title}</h2>
                    </div>
                </div>
            `;

            // Popular (Sort by views)
            const popularGrid = document.getElementById('popularGrid');
            popularGrid.innerHTML = '';
            [...data].sort((a,b) => b.views - a.views).slice(0, 8).forEach(v => {
                popularGrid.innerHTML += `
                    <div onclick="loadPost('${v.id}')" class="min-w-[140px] md:min-w-[180px] group cursor-pointer">
                        <div class="aspect-[3/4] rounded-xl overflow-hidden mb-2 relative">
                            <img src="${v.thumb}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition"><i class="fa-solid fa-play text-white"></i></div>
                        </div>
                        <h3 class="text-[10px] font-bold truncate">${v.title}</h3>
                    </div>
                `;
            });

            // Latest
            renderLatest();
        }

        function renderLatest() {
            const grid = document.getElementById('latestGrid');
            const data = videoData.filter(v => isNSFW ? true : !v.nsfw);
            grid.innerHTML = '';
            
            data.slice(0, limit).forEach(post => {
                grid.innerHTML += `
                    <div onclick="loadPost('${post.id}')" class="group cursor-pointer bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border dark:border-slate-800 transition-all hover:ring-2 ring-blue-500">
                        <div class="aspect-[3/4] relative overflow-hidden">
                            <img src="${post.thumb}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-play text-white text-2xl"></i></div>
                        </div>
                        <div class="p-3">
                            <h3 class="text-[11px] font-bold line-clamp-2">${post.title}</h3>
                            <p class="text-[9px] text-slate-500 mt-2 font-mono uppercase">${post.code}</p>
                        </div>
                    </div>
                `;
            });
            document.getElementById('loadMoreBtn').style.display = limit >= data.length ? 'none' : 'block';
        }

        function loadMore() {
            limit += 10;
            renderLatest();
        }

        async function loadPost(postId) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            const area = document.getElementById('postArea');
            area.innerHTML = '<div class="text-center p-20"><i class="fa-solid fa-spinner animate-spin text-3xl"></i></div>';

            try {
                const res = await fetch(`content/${postId}.html`);
                const html = await res.text();
                
                // Auto Recommended (Random)
                const recs = videoData.filter(v => v.id !== postId).sort(() => 0.5 - Math.random()).slice(0, 5);
                let recHtml = `<div class="mt-10 lg:mt-0 space-y-4">
                    <h3 class="font-black border-l-4 border-blue-500 pl-3">REKOMENDASI</h3>`;
                recs.forEach(r => {
                    recHtml += `<div onclick="loadPost('${r.id}')" class="flex gap-3 bg-slate-900/40 p-2 rounded-xl cursor-pointer hover:bg-slate-800 transition">
                        <img src="${r.thumb}" class="w-16 h-20 object-cover rounded-lg">
                        <div class="flex flex-col justify-center"><h4 class="text-[11px] font-bold line-clamp-2">${r.title}</h4><span class="text-[9px] opacity-40 mt-1 font-mono">${r.code}</span></div>
                    </div>`;
                });
                recHtml += `</div>`;

                area.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2">${html}</div>
                    <div>${recHtml}</div>
                </div>`;
                window.scrollTo(0,0);
            } catch (e) { area.innerHTML = 'Error loading content.'; }
        }

        function renderFilterPage(type) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            const list = document.getElementById('listView');
            const grid = document.getElementById('listGrid');
            list.classList.remove('hidden');
            document.getElementById('listTitle').innerText = `LIST ${type}`;
            grid.innerHTML = '';

            let items = [];
            videoData.forEach(v => {
                const val = v[type];
                Array.isArray(val) ? items.push(...val) : items.push(val);
            });

            [...new Set(items)].sort().forEach(item => {
                grid.innerHTML += `<button onclick="filterBy('${type}', '${item}')" class="bg-white dark:bg-slate-900 p-4 rounded-xl text-left border dark:border-slate-800 hover:border-blue-500 transition group">
                    <span class="block font-bold truncate group-hover:text-blue-500 uppercase text-xs">${item}</span>
                </button>`;
            });
        }

        function filterBy(type, value) {
            const filtered = videoData.filter(v => Array.isArray(v[type]) ? v[type].includes(value) : v[type] === value);
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            renderGridCustom(filtered, value);
        }

        function renderGridCustom(data, label) {
            document.getElementById('featuredHero').innerHTML = `<div class="mb-6 p-4 bg-blue-500/10 border border-blue-500/20 rounded-xl flex justify-between items-center">
                <span class="font-bold text-sm">Menampilkan: <span class="text-blue-500 underline">${label}</span></span>
                <button onclick="goHome()" class="text-[10px] bg-blue-600 px-3 py-1 rounded-full text-white font-bold">RESET</button>
            </div>`;
            document.getElementById('popularGrid').parentElement.classList.add('hidden');
            const latestGrid = document.getElementById('latestGrid');
            latestGrid.innerHTML = '';
            data.forEach(post => {
                latestGrid.innerHTML += `
                    <div onclick="loadPost('${post.id}')" class="group cursor-pointer bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border dark:border-slate-800 transition-all hover:ring-2 ring-blue-500">
                        <div class="aspect-[3/4] relative overflow-hidden"><img src="${post.thumb}" class="w-full h-full object-cover"></div>
                        <div class="p-3"><h3 class="text-[11px] font-bold line-clamp-2">${post.title}</h3></div>
                    </div>
                `;
            });
            document.getElementById('loadMoreBtn').style.display = 'none';
        }

        function renderAZ() {
            renderFilterPage('artists');
            document.getElementById('listTitle').innerText = "A-Z LIST MOVIE";
            const grid = document.getElementById('listGrid');
            grid.className = "space-y-6 col-span-full";
            grid.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
                const movies = videoData.filter(v => v.title.toUpperCase().startsWith(l)).sort((a,b) => a.title.localeCompare(b.title));
                if(movies.length > 0) {
                    grid.innerHTML += `<div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800">
                        <h3 class="text-2xl font-black text-blue-500 mb-4">${l}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2">${movies.map(m => `<div onclick="loadPost('${m.id}')" class="cursor-pointer hover:text-blue-500 py-2 border-b dark:border-slate-800 flex justify-between text-xs font-bold tracking-tight"><span>${m.title}</span><span class="opacity-40 font-mono">${m.code}</span></div>`).join('')}</div>
                    </div>`;
                }
            });
        }

        function searchPosts() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const data = videoData.filter(v => v.title.toLowerCase().includes(val) || v.code.toLowerCase().includes(val));
            renderGridCustom(data, 'Hasil Pencarian');
        }

        function goHome() {
            limit = 10;
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('popularGrid').parentElement.classList.remove('hidden');
            document.getElementById('listGrid').className = "grid grid-cols-2 md:grid-cols-6 gap-4";
            renderHome();
        }

        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
        renderHome();
    </script>
</body>
</html>
